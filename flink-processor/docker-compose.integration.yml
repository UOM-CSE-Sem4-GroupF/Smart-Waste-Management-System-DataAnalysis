services:
  kafka:
    image: bitnami/kafka:3.7
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics.sh",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 15s
      timeout: 10s
      retries: 8

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waste_management}
      POSTGRES_USER: ${POSTGRES_USER:-waste_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waste_admin_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-waste_admin} -d ${POSTGRES_DB:-waste_management}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:-admin12345}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG:-waste-org}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET:-waste-bootstrap}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN:-my-super-token}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 10

  influxdb-setup:
    image: influxdb:2.7
    restart: "no"
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      INFLUXDB_HOST: http://influxdb:8086
      INFLUXDB_ORG: ${INFLUXDB_INIT_ORG:-waste-org}
      INFLUXDB_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN:-my-super-token}
    volumes:
      - ../db/influx/setup-buckets.sh:/scripts/setup-buckets.sh:ro
    entrypoint: ["sh", "/scripts/setup-buckets.sh"]

  flink-pipeline1:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      influxdb-setup:
        condition: service_completed_successfully
    env_file:
      - ./.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USERNAME: ""
      KAFKA_PASSWORD: ""
      POSTGRES_HOST: postgres
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUXDB_INIT_ORG:-waste-org}
      INFLUX_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN:-my-super-token}
      INFLUX_ENABLED: "true"
      INFLUX_ZONE_BUCKET: zone_statistics
      INFLUX_VEHICLE_BUCKET: vehicle_positions
    command: ["python", "job.py", "--mode", "kafka"]

  flink-pipeline2:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      influxdb-setup:
        condition: service_completed_successfully
    env_file:
      - ./.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USERNAME: ""
      KAFKA_PASSWORD: ""
      POSTGRES_HOST: postgres
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUXDB_INIT_ORG:-waste-org}
      INFLUX_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN:-my-super-token}
      INFLUX_ENABLED: "true"
      INFLUX_ZONE_BUCKET: zone_statistics
      INFLUX_VEHICLE_BUCKET: vehicle_positions
    command: ["python", "job_zone.py", "--mode", "kafka"]

  flink-pipeline3:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USERNAME: ""
      KAFKA_PASSWORD: ""
      POSTGRES_HOST: postgres
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUXDB_INIT_ORG:-waste-org}
      INFLUX_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN:-my-super-token}
      INFLUX_ENABLED: "true"
      INFLUX_ZONE_BUCKET: zone_statistics
      INFLUX_VEHICLE_BUCKET: vehicle_positions
    command: ["python", "job_deviation.py", "--mode", "kafka"]

  flink-pipeline4:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      influxdb-setup:
        condition: service_completed_successfully
    env_file:
      - ./.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_USERNAME: ""
      KAFKA_PASSWORD: ""
      POSTGRES_HOST: postgres
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUXDB_INIT_ORG:-waste-org}
      INFLUX_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN:-my-super-token}
      INFLUX_ENABLED: "true"
      INFLUX_ZONE_BUCKET: zone_statistics
      INFLUX_VEHICLE_BUCKET: vehicle_positions
    command: ["python", "job_vehicle.py", "--mode", "kafka"]

volumes:
  kafka_data:
  postgres_data:
  influxdb_data:
  