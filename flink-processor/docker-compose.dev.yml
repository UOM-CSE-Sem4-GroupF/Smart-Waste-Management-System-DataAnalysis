services:
  # ── Pipeline 1: Bin Telemetry Processor ─────────────────────────────────────
  # Consumes waste.bin.telemetry → enriches → InfluxDB + PostgreSQL + waste.bin.processed
  flink-pipeline1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flink-pipeline1-dev
    restart: unless-stopped
    extra_hosts:
      - "controller.internal:${KAFKA_IP:-163.47.8.3}"
    environment:
      # Kafka Connectivity
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SASL_PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      KAFKA_INPUT_TOPIC: waste.bin.telemetry
      KAFKA_OUTPUT_TOPIC: waste.bin.processed

      # Database Connectivity
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # InfluxDB Connectivity
      INFLUX_URL: ${INFLUX_URL}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}

      # App Config
      APP_ENV: development
      LOG_LEVEL: INFO
      FLINK_KAFKA_JAR: /opt/flink/lib/flink-sql-connector-kafka.jar
    command: ["python", "job.py", "--mode", "pyflink-kafka"]
    volumes:
      - .:/app
    networks:
      - default
      - garabadge

  # ── Pipeline 2: Zone Aggregation ────────────────────────────────────────────
  flink-pipeline2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flink-pipeline2-dev
    restart: unless-stopped
    extra_hosts:
      - "controller.internal:${KAFKA_IP:-163.47.8.3}"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SASL_PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      KAFKA_ZONE_INPUT_TOPIC: waste.bin.processed
      KAFKA_ZONE_OUTPUT_TOPIC: waste.zone.statistics
      KAFKA_ZONE_INPUT_PARTITIONS: 6
      ZONE_WINDOW_MINUTES: 10
      ZONE_SLIDE_MINUTES: 2

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      INFLUX_URL: ${INFLUX_URL}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}

      APP_ENV: development
      LOG_LEVEL: INFO
      FLINK_KAFKA_JAR: /opt/flink/lib/flink-sql-connector-kafka.jar
    command: ["python", "job_zone.py", "--mode", "pyflink-kafka"]
    volumes:
      - .:/app
    networks:
      - default
      - garabadge

  # ── Pipeline 3: Vehicle Deviation Detector ───────────────────────────────────
  flink-pipeline3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flink-pipeline3-dev
    restart: unless-stopped
    extra_hosts:
      - "controller.internal:${KAFKA_IP:-163.47.8.3}"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SASL_PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      KAFKA_VEHICLE_LOCATION_TOPIC: waste.vehicle.location
      KAFKA_VEHICLE_DEVIATION_TOPIC: waste.vehicle.deviation
      KAFKA_VEHICLE_LOCATION_PARTITIONS: 4

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      APP_ENV: development
      LOG_LEVEL: INFO
    command: ["python", "job_deviation.py", "--mode", "pyflink-kafka"]
    volumes:
      - .:/app
    networks:
      - default
      - garabadge

  # ── Pipeline 4: Vehicle Position Historian ───────────────────────────────────
  flink-pipeline4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flink-pipeline4-dev
    restart: unless-stopped
    extra_hosts:
      - "controller.internal:${KAFKA_IP:-163.47.8.3}"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SASL_PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      KAFKA_VEHICLE_LOCATION_TOPIC: waste.vehicle.location
      KAFKA_VEHICLE_LOCATION_PARTITIONS: 4

      INFLUX_URL: ${INFLUX_URL}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}

      APP_ENV: development
      LOG_LEVEL: INFO
    command: ["python", "job_vehicle.py", "--mode", "pyflink-kafka"]
    volumes:
      - .:/app
    networks:
      - default
      - garabadge

  # ── Pipeline 5: Sensor Offline Detector ─────────────────────────────────────
  flink-pipeline5:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flink-pipeline5-dev
    restart: unless-stopped
    extra_hosts:
      - "controller.internal:${KAFKA_IP:-163.47.8.3}"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_USERNAME: ${KAFKA_USERNAME}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-SASL_PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-SCRAM-SHA-256}
      KAFKA_INPUT_TOPIC: waste.bin.telemetry
      KAFKA_OUTPUT_TOPIC: waste.bin.processed
      KAFKA_TELEMETRY_PARTITIONS: 6
      OFFLINE_THRESHOLD_MINUTES: 30
      TICK_INTERVAL_SECONDS: 60

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      APP_ENV: development
      LOG_LEVEL: INFO
    command: ["python", "job_sensor_offline.py", "--mode", "kafka"]
    volumes:
      - .:/app
    networks:
      - default
      - garabadge

networks:
  garabadge:
    external: true
