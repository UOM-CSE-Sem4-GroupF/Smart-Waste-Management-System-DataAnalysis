name: Build and Push DataAnalysis Services

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'flink-processor/**'
      - 'core-api/**'
      - 'route-optimizer/**'
      - 'ml-service/**'
      - 'airflow/**'
      - 'spark/**'

env:
  REGISTRY: ghcr.io
  ORG_NAME: uom-cse-sem4-groupf

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [flink-processor, core-api, route-optimizer, ml-service, airflow, spark]
        include:
          - service: flink-processor
            context: ./flink-processor
            image: flink-processor
          - service: core-api
            context: ./core-api
            image: core-api
          - service: route-optimizer
            context: ./route-optimizer
            image: route-optimizer
          - service: ml-service
            context: ./ml-service
            image: ml-service
          - service: airflow
            context: ./airflow
            image: airflow
          - service: spark
            context: ./spark
            image: spark

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG_NAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Make package public
        continue-on-error: true
        run: |
          gh api --method PATCH \
            "/orgs/${{ env.ORG_NAME }}/packages/container/${{ matrix.image }}" \
            -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
