version: '3.8'

x-common-env: &common-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  PROCESSING_TIMEZONE: ${PROCESSING_TIMEZONE:-UTC}

services:
  # ================================================================
  # DATA STORAGE LAYER
  # ================================================================

  # PostgreSQL for Airflow metadata
  postgres-airflow:
    image: postgres:15-alpine
    container_name: waste-postgres-airflow
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_secure_password
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    networks:
      - waste-network
      - garabadge
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5





  # ================================================================
  # ML & MODEL MANAGEMENT
  # ================================================================

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: waste-mlflow
    ports:
      - "5000:5000"
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:////mlflow/mlflow.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    networks:
      - waste-network
      - garabadge
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: waste-ml-service
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      MLFLOW_FILL_MODEL_NAME: ${MLFLOW_FILL_MODEL_NAME}
      MLFLOW_ZONE_MODEL_NAME: ${MLFLOW_ZONE_MODEL_NAME}
      MLFLOW_ROUTE_MODEL_NAME: ${MLFLOW_ROUTE_MODEL_NAME}
      MLFLOW_MODEL_STAGE: ${MLFLOW_MODEL_STAGE}
      SERVICE_VERSION: ${SERVICE_VERSION}
      MLFLOW_REGISTRY_ENABLED: ${MLFLOW_REGISTRY_ENABLED}
      ML_SERVICE_FALLBACK_MODE: ${ML_SERVICE_FALLBACK_MODE}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-waste_management}
      POSTGRES_USER: ${POSTGRES_USER:-waste_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waste_admin_password}
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - waste-network
      - garabadge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ================================================================
  # STREAM PROCESSING LAYER
  # ================================================================

  flink-processor:
    build:
      context: ./flink-processor
      dockerfile: Dockerfile
    container_name: waste-flink-processor
    environment:
      <<: *common-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_INPUT_TOPIC: ${KAFKA_TELEMETRY_TOPIC}
      KAFKA_OUTPUT_TOPIC: ${KAFKA_PROCESSED_TOPIC}
      KAFKA_VEHICLE_LOCATION_TOPIC: ${KAFKA_VEHICLE_LOCATION_TOPIC}
      KAFKA_VEHICLE_DEVIATION_TOPIC: ${KAFKA_VEHICLE_DEVIATION_TOPIC}
      KAFKA_ZONE_INPUT_TOPIC: ${KAFKA_PROCESSED_TOPIC}
      KAFKA_ZONE_OUTPUT_TOPIC: ${KAFKA_ZONE_TOPIC}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-waste_management}
      POSTGRES_USER: ${POSTGRES_USER:-waste_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waste_admin_password}
      INFLUX_URL: ${INFLUX_URL:-http://influxdb:8086}
      INFLUX_ORG: ${INFLUX_ORG:-waste-org}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-my-super-token}
      INFLUX_ENABLED: ${INFLUX_ENABLED:-true}
      INFLUX_RAW_BUCKET: ${INFLUX_RAW_BUCKET:-waste-telemetry-raw}
      INFLUX_PROCESSED_BUCKET: ${INFLUX_PROCESSED_BUCKET:-waste-telemetry-processed}
      INFLUX_ZONE_BUCKET: ${INFLUX_ZONE_BUCKET:-waste-zone-stats}
      INFLUX_VEHICLE_BUCKET: ${INFLUX_VEHICLE_BUCKET:-waste-vehicle-stats}
      FLINK_INPUT_MODE: kafka
    networks:
      - waste-network
      - garabadge
    volumes:
      - flink_logs:/opt/flink/logs

  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile
    container_name: waste-core-api
    ports:
      - "8001:8001"
    environment:
      NODE_ENV: production
      PORT: 8001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-waste_admin}:${POSTGRES_PASSWORD:-waste_admin_password}@postgres:5432/${POSTGRES_DB:-waste_management}?schema=f2

    networks:
      - waste-network
      - garabadge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  route-optimizer:
    build:
      context: ./route-optimizer
      dockerfile: Dockerfile
    container_name: waste-route-optimizer
    ports:
      - "8083:8083"
    environment:
      <<: *common-env
      KAFKA_BROKERS: kafka:29092
      KAFKA_INPUT_TOPIC: ${KAFKA_PROCESSED_TOPIC:-waste.bin.processed}
      KAFKA_OUTPUT_TOPIC: ${KAFKA_ROUTES_TOPIC:-waste.routes.optimized}
      KAFKA_GROUP_ID: ${ROUTE_OPTIMIZER_GROUP_ID:-route-optimizer-group}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-waste_management}
      DB_USER: ${POSTGRES_USER:-waste_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-waste_admin_password}
      ROUTE_OPTIMIZER_URGENCY_THRESHOLD: ${ROUTE_OPTIMIZER_URGENCY_THRESHOLD:-70}
    volumes:
      - ./route-optimizer:/app
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8083"]
    networks:
      - waste-network
      - garabadge

  flink-sensor-offline:
    build:
      context: ./flink-processor
      dockerfile: Dockerfile
    container_name: waste-flink-sensor-offline
    command: ["python", "job_sensor_offline.py", "--mode", "kafka"]
    environment:
      <<: *common-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_INPUT_TOPIC: ${KAFKA_TELEMETRY_TOPIC}
      KAFKA_OUTPUT_TOPIC: ${KAFKA_PROCESSED_TOPIC}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-waste_management}
      POSTGRES_USER: ${POSTGRES_USER:-waste_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waste_admin_password}
      # Override defaults if needed via env file
      OFFLINE_THRESHOLD_MINUTES: ${OFFLINE_THRESHOLD_MINUTES:-30}
      TICK_INTERVAL_SECONDS: ${TICK_INTERVAL_SECONDS:-60}
    networks:
      - waste-network
      - garabadge

  # ================================================================
  # BATCH PROCESSING & ORCHESTRATION
  # ================================================================

  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: waste-airflow
    environment:
      <<: *common-env
      AIRFLOW_HOME: /airflow
      AIRFLOW__CORE__DAGS_FOLDER: /airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_secure_password@postgres-airflow:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: 8PIl0qwvhYbCKvQwi-pTbYZHx-0OMpkr5j-3MN0ZGSQ=
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI}
      ML_SERVICE_URL: http://ml-service:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SCHEDULE_TRIGGER_TOPIC: ${KAFKA_SCHEDULE_TRIGGER_TOPIC}
      KAFKA_MODEL_RETRAINED_TOPIC: ${KAFKA_MODEL_RETRAINED_TOPIC}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-waste_management}
      POSTGRES_USER: ${POSTGRES_USER:-waste_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waste_admin_password}
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/airflow/dags
      - ./airflow/logs:/airflow/logs
      - ./airflow/plugins:/airflow/plugins
    depends_on:
      postgres-airflow:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      # kafka-topics-init is an init helper (run with `--profile init`)
    networks:
      - waste-network
      - garabadge
    command: >
      bash -c "
      airflow db init;
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true;
      sleep 5;
      airflow webserver -p 8080 &
      sleep 10;
      airflow scheduler
      "

  # Spark (optional, for batch analytics)
  spark-master:
    image: bitnami/spark:3.5.0
    container_name: waste-spark-master
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_USER: spark
    ports:
      - "8081:8081"
      - "7077:7077"
    networks:
      - waste-network
      - garabadge
    profiles: ["analytics"]

  spark-worker:
    image: bitnami/spark:3.5.0
    container_name: waste-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_USER: spark
    depends_on:
      - spark-master
    networks:
      - waste-network
      - garabadge
    profiles: ["analytics"]

  # ================================================================
  # TESTING & MONITORING
  # ================================================================

  app-consumer:
    build:
      context: ./app-consumer
      dockerfile: Dockerfile
    container_name: waste-app-consumer
    environment:
      <<: *common-env
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: ${KAFKA_TELEMETRY_TOPIC}
      # kafka-topics-init is an init helper (run with `--profile init`)
    networks:
      - waste-network
      - garabadge
    profiles: ["test"]

# ================================================================
# NETWORKS
# ================================================================

networks:
  waste-network:
    driver: bridge
  garabadge:
    external: true

# ================================================================
# VOLUMES
# ================================================================

volumes:
  postgres_airflow_data:
  postgres_waste_data:
  influxdb_data:
  mlflow_data:
  flink_logs:
