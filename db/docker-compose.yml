services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: waste_management
      POSTGRES_USER: waste_admin
      POSTGRES_PASSWORD: waste_admin_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U waste_admin -d waste_management" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
